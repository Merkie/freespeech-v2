<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no is honoured by installed PWAs and Android Chrome; mobile Safari tabs
         ignore it, so components/PreventZoom.tsx cancels the gesture events instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#18181b" />
    <meta name="description" content="FreeSpeech AAC - Augmentative and Alternative Communication app for speech assistance" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreeSpeech" />

    <!-- All CSS, including the self-hosted Bootstrap Icons webfont, is imported by
         src/index.tsx so Vite can hash it and the service worker can precache it. -->

    <title>FreeSpeech AAC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
